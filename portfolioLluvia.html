    <style>
        html {
            box-sizing: border-box;
            font-size: 100%;
        }
        /* amaranth-regular - latin */
        @font-face {
            font-display: swap; /* Check https://developer.mozilla.org/en-US/docs/Web/CSS/@font-face/font-display for other options. */
            font-family: 'Amaranth';
            font-style: normal;
            font-weight: 400;
            src: url('Fonts/amaranth-v19-latin-regular.woff2') format('woff2'); /* Chrome 36+, Opera 23+, Firefox 39+, Safari 12+, iOS 10+ */
        }
        /* bebas-neue-regular - latin */
        @font-face {
            font-display: swap; /* Check https://developer.mozilla.org/en-US/docs/Web/CSS/@font-face/font-display for other options. */
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            src: url('Fonts/bebas-neue-v16-latin-regular.woff2') format('woff2'); /* Chrome 36+, Opera 23+, Firefox 39+, Safari 12+, iOS 10+ */
        }
        /* rubik-mono-one-regular - latin */
        @font-face {
            font-display: swap; /* Check https://developer.mozilla.org/en-US/docs/Web/CSS/@font-face/font-display for other options. */
            font-family: 'Rubik Mono One';
            font-style: normal;
            font-weight: 400;
            src: url('Fonts/rubik-mono-one-v20-latin-regular.woff2') format('woff2'); /* Chrome 36+, Opera 23+, Firefox 39+, Safari 12+, iOS 10+ */
        }

        body {
            background: #2e213d;
            color: #dad5e9;
            font-family: 'Amaranth',Arial,sans-serif;
            font-size: 1.5rem;
            width: min(calc(100% - 40px), 100rem);
            margin-inline: auto;
            letter-spacing: 1px;
        }

        h1 {
            font-family: 'Rubik Mono One',Verdana,sans-serif;
            color: #2e213d;
            font-size: 4rem;
            line-height: 0.5;
            margin: 1;
        }
        h2 {
            font-family: 'Bebas Neue',Verdana,sans-serif;
            color: #2e213d;
            font-size: 3rem;
            line-height: 0.5;
            letter-spacing: 3px;
        }
        h3 {
            font-family: 'Bebas Neue',Verdana,sans-serif;
            color: #FFFFFF;
            font-size: 2.5rem;
            line-height: 0.5;
            letter-spacing: 3px;
        }        
        p {
           line-height: 1.5;
           max-width: 70ch; 
           margin-block: 20px;
        }
        .wrapper {
            width: min(calc(100% - 40px), 100rem);
            margin-inline: auto;
        }
        .parent {
            position: relative;
            background-color: transparent;
        }
        .block {
            background-color: transparent;
            position: absolute;
            width: 120px;
            height: 120px;
            Bottom: 35px;
            Left: 350px;
        }
        a:link {
            color: rgb(255, 247, 130);
            background-color: transparent;
            text-decoration: none;
        }
        a:visited {
            color: rgb(255, 247, 130);
            background-color: transparent;
            text-decoration: none;
        }
        a:hover {
            color: #ffa844;
            background-color: transparent;
            text-decoration: none;
        }
        strong {
            color: #ffffff;
        }
        header {
            background: #d7aefd;
            padding: 20px;
        }
    </style>
